<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">AIDA-ReID — Learning across domains</title>
  <desc id="desc">Feedback-regulated intermediate-domain learning, with MS-IDG, PMR and DFC, for domain generalization and source-free adaptation.</desc>
