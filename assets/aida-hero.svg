    <linearGradient id="line"><stop stop-color="#38d9c5"/><stop offset="1" stop-color="#8fa9ff"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <circle cx="1165" cy="30" r="230" fill="#547dff" opacity=".07"/>
  <circle cx="1130" cy="20" r="180" fill="none" stroke="#819cff" stroke-opacity=".15"/>
